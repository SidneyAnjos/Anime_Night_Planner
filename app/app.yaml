# Databricks Apps configuration for the Anime Night Planner.
# Docs: https://docs.databricks.com/aws/en/apps/configuration
#
# DATABRICKS_HOST / DATABRICKS_TOKEN are injected automatically for the app's service principal.

command: streamlit run app.py

env:
  # Unity Catalog location for the tables (keep in sync with pipeline/00_setup_tables.py).
  - name: CATALOG
    value: anime_night_planner
  - name: SCHEMA
    value: default
  # Http path of the serverless SQL warehouse the app uses for reads AND agent writes.
  # Fill this in from the SQL warehouse's "Connection details" tab, e.g. /sql/1.0/warehouses/<id>.
  - name: SQL_WAREHOUSE_PATH
    value: /sql/1.0/warehouses/REPLACE_ME
  # Mosaic AI foundation model endpoints (pay-as-you-go). Swap for models available in your workspace.
  - name: EMBED_ENDPOINT
    value: databricks-bge-large-en
  - name: CHAT_ENDPOINT
    value: databricks-meta-llama-3-3-70b-instruct

resources:
  requests:
    memory: 2Gi
    cpu: "1.0"
  limits:
    memory: 4Gi
    cpu: "2.0"
