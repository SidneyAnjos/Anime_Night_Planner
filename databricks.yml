# This is a Declarative Automation Bundle definition for Movie_Night_Planner.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: Movie_Night_Planner

variables:
  tmdb_secret_scope:
    description: Databricks secret scope holding the TMDB API key (key name \"tmdb_api_key\").
    default: movie_night_planner

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-1e8b237a-8e29.cloud.databricks.com
      profile: SidneyAnjos

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-1e8b237a-8e29.cloud.databricks.com

resources:
  jobs:
    movie_pipeline_job:
      name: movie_pipeline_job
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./pipeline/00_setup_tables.py
        - task_key: ingest
          notebook_task:
            notebook_path: ./pipeline/01_ingest_raw.py
          depends_on:
            - task_key: setup
        - task_key: transform
          notebook_task:
            notebook_path: ./pipeline/02_transform_silver.py
          depends_on:
            - task_key: ingest
        - task_key: embed
          notebook_task:
            notebook_path: ./pipeline/03_embed.py
          depends_on:
            - task_key: transform
        - task_key: index
          notebook_task:
            notebook_path: ./pipeline/04_vector_index.py
          depends_on:
            - task_key: embed
      # Nightly refresh: keep TMDB data + the vector index current.
      schedule:
        quartz_cron_expression: "0 7 3 * * ?"
        timezone_id: UTC

  apps:
    movie-night-planner:
      name: movie-night-planner
      source_code_path: ./app
      config:
        command:
          - streamlit
          - run
          - app.py
        env:
          - name: CATALOG
            value: movie_night_planner
          - name: SCHEMA
            value: default
          # Http path of the serverless SQL warehouse the app uses for reads AND agent writes.
          - name: SQL_WAREHOUSE_PATH
            value: /sql/1.0/warehouses/eb31d64c1ca0b603
          # Mosaic AI foundation model endpoints (pay-as-you-go).
          - name: EMBED_ENDPOINT
            value: databricks-bge-large-en
          - name: CHAT_ENDPOINT
            value: databricks-meta-llama-3-3-70b-instruct
        # The app does not need the TMDB key (it only reads from Unity Catalog), so the secret is
        # NOT mounted here — only the ingest notebook reads it, via dbutils.secrets.get.
